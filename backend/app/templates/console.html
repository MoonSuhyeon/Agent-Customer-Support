<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상담 콘솔 — Agent Customer Support</title>
<script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous" defer></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --line: #e3e6ea; --ink: #16191d;
    --muted: #6b7280; --accent: #1d4ed8; --hold: #b45309; --hold-bg: #fffbeb;
    --ok: #047857; --ok-bg: #ecfdf5; --stop: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --line: #2a3038; --ink: #e8eaed;
      --muted: #9aa4b2; --accent: #60a5fa; --hold: #fbbf24; --hold-bg: #2a2313;
      --ok: #34d399; --ok-bg: #10241d; --stop: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  header { padding: 22px 20px 6px; max-width: 1060px; margin: 0 auto; }
  h1 { font-size: 19px; margin: 0 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0; }
  main {
    max-width: 1060px; margin: 0 auto; padding: 16px 20px 48px;
    display: grid; grid-template-columns: 260px 1fr; gap: 18px; align-items: start;
  }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px;
  }
  .card h2 {
    font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px; font-weight: 700;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  .bid { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-weight: 600; }
  .dim { color: var(--muted); }
  form.ask { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] {
    flex: 1; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 9px; background: var(--panel); color: var(--ink); font-size: 14px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 10px 16px; border: 0; border-radius: 9px; cursor: pointer;
    font-size: 14px; font-weight: 600; background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button.stop { background: var(--stop); }
  .hint { font-size: 12px; color: var(--muted); margin: -8px 0 16px; }
  code {
    font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    background: var(--bg); padding: 1px 5px; border-radius: 4px;
  }
</style>
</head>
<body>
<header>
  <h1>상담 콘솔</h1>
  <p class="sub">에이전트는 예약을 바꾸기 전에 멈춘다. 멈춘 자리를 사람이 보는 화면.</p>
</header>

<main>
  <aside class="card">
    <h2>예약</h2>
    <table>
      {% for b in bookings %}
      <tr>
        <td>
          <span class="bid">{{ b.booking_id }}</span><br>
          <span class="dim">{{ properties[b.property_id].name }}</span>
        </td>
        <td style="text-align:right">
          {{ "{:,}".format(b.amount) }}원<br>
          <span class="dim">{{ b.check_in }}</span>
        </td>
      </tr>
      {% endfor %}
    </table>
  </aside>

  <section>
    <form class="ask" method="post"
          action="/console/{{ session_id }}/send"
          hx-post="/console/{{ session_id }}/send"
          hx-target="#thread" hx-swap="outerHTML">
      <input type="text" name="message" required autofocus
             placeholder="예: B1002 예약을 취소하고 싶어요">
      <button type="submit">보내기</button>
    </form>
    <p class="hint">세션 <code>{{ session_id }}</code> · 승인 전에는 어떤 예약도 바뀌지 않는다.</p>

    {% include "_thread.html" %}
  </section>
</main>
</body>
</html>
